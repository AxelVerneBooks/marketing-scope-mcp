# Release — bump version, roll CHANGELOG, packaging dry-run.
#
# Manually triggered. This workflow NEVER publishes to npm or the MCP registry;
# publishing stays a hand step (see PUBLISH.md). With open_pr enabled it pushes
# a release/vX.Y.Z branch and opens a PR carrying the bump for review.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch, minor, major, or an explicit X.Y.Z"
        required: true
        default: patch
      open_pr:
        description: "Push a release branch and open a PR with the bump"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bump version and update CHANGELOG
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(node scripts/bump-version.mjs "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Build and test
        run: npm test

      - name: Packaging dry-run
        run: |
          npm pack --dry-run 2>&1 | tee pack-dry-run.txt
          mkdir -p pack-out
          npm pack --pack-destination pack-out

      - name: Upload packaging artifacts
        uses: actions/upload-artifact@v4
        with:
          name: marketing-scope-mcp-${{ steps.bump.outputs.version }}-dry-run
          path: |
            pack-dry-run.txt
            pack-out/*.tgz
          retention-days: 14

      - name: Release notes
        run: |
          {
            echo "## marketing-scope-mcp v${{ steps.bump.outputs.version }} (dry run — not published)"
            echo
            awk '/^## [0-9]/{n++} n==1' CHANGELOG.md | tail -n +2
            echo
            echo "### Package contents"
            echo '```'
            cat pack-dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open release PR
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json server.json CHANGELOG.md src
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Release v$VERSION" \
            --body "Version bump and CHANGELOG update generated by the Release workflow ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Packaging dry-run passed; nothing was published. After merging, publish by hand per PUBLISH.md."
