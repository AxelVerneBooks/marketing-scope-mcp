name: Bug report
description: A tool returns the wrong result, errors, or the server misbehaves
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which part is affected?
      options:
        - plan_campaign
        - score_offer
        - build_plan
        - check_plan
        - stdio transport
        - Streamable HTTP transport
        - Docker image
        - Install / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact tool call(s) and arguments. For score_offer, paste the offer text.
      placeholder: |
        score_offer(offer: "...")
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Full tool output or error, including the per-dimension evidence for scoring issues.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: marketing-scope-mcp version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Node version, OS, and MCP client (Claude Code, Cursor, …)
      placeholder: "Node 22.11, macOS 15, Claude Code"
